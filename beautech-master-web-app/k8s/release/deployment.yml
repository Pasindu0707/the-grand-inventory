apiVersion: v1
kind: Service
metadata:
  name: beautech-master-web-app
  namespace: actogo-release
  labels:
    app: beautech-master-web-app
spec:
  selector:
    app: beautech-master-web-app
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beautech-master-web-app
  namespace: actogo-release
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: beautech-master-web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: beautech-master-web-app
    spec:
      nodeSelector:
        pool: systempool
      containers:
        - name: beautech-master-web-app
          image: registry.gitlab.com/accto-go-cloud/web-apps/beautech-master-web-app:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      imagePullSecrets:
        - name: regcred

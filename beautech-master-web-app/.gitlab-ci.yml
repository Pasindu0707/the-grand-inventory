variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain
  K8S_DEPLOYMENT_NAME: acctogo-web-app
  K8S_CONTAINER_NAME: acctogo-web-app
  IMAGE_BASE: registry.gitlab.com/accto-go-cloud/web-apps/acctogo-web-app

stages:
  - docker-build
  - k8-deploy

.build_template:
  stage: docker-build
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - 'docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"'
    - 'docker buildx create --name ci-builder --driver docker-container --use || docker buildx use ci-builder'
    - 'docker buildx inspect --bootstrap'
  script:
    - 'sed -i "s/APP_DOMAIN_PLACEHOLDER/$DOMAIN_NAME/g" conf/nginx.conf'
    - 'docker buildx build --platform linux/amd64 --build-arg BUILD_CONFIGURATION="$BUILD_CONFIGURATION" --cache-from type=registry,ref="$CACHE_IMAGE" --cache-to type=registry,ref="$CACHE_IMAGE",mode=max -t "$CONTAINER_IMAGE" --push .'

.deploy_template:
  stage: k8-deploy
  variables:
    GIT_STRATEGY: fetch
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - 'echo "Deploying to namespace: $K8S_NAMESPACE"'
    - 'kubectl config use-context "accto-go-cloud/k8-configs:k8-configs"'
    - 'kubectl apply -n "$K8S_NAMESPACE" -f "$K8S_MANIFEST_PATH"'
    - 'kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT_NAME" "$K8S_CONTAINER_NAME=$CONTAINER_IMAGE"'
    - 'kubectl -n "$K8S_NAMESPACE" rollout restart "deployment/$K8S_DEPLOYMENT_NAME"'

build-staging:
  extends: .build_template
  variables:
    DOMAIN_NAME: stg.actogo.io
    BUILD_CONFIGURATION: staging
    CACHE_IMAGE: "$IMAGE_BASE:stg-buildcache"
    CONTAINER_IMAGE: "$IMAGE_BASE:stg-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PROJECT_ID == "71839926" && $CI_COMMIT_BRANCH == "staging/actogo/0.0.1"'
    - when: never

deploy-staging:
  extends: .deploy_template
  variables:
    K8S_NAMESPACE: actogo-staging
    K8S_MANIFEST_PATH: k8s/staging/deployment.yml
    CONTAINER_IMAGE: "$IMAGE_BASE:stg-$CI_COMMIT_SHORT_SHA"
  needs: ["build-staging"]
  environment:
    name: staging
  rules:
    - if: '$CI_PROJECT_ID == "71839926" && $CI_COMMIT_BRANCH == "staging/actogo/0.0.1"'
    - when: never

build-release:
  extends: .build_template
  variables:
    DOMAIN_NAME: app.actogo.io
    BUILD_CONFIGURATION: release
    CACHE_IMAGE: "$IMAGE_BASE:prod-buildcache"
    CONTAINER_IMAGE: "$IMAGE_BASE:prod-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PROJECT_ID == "71839926" && $CI_COMMIT_BRANCH == "release/actogo/0.0.1"'
    - when: never

deploy-release:
  extends: .deploy_template
  variables:
    K8S_NAMESPACE: actogo-release
    K8S_MANIFEST_PATH: k8s/release/deployment.yml
    CONTAINER_IMAGE: "$IMAGE_BASE:prod-$CI_COMMIT_SHORT_SHA"
  needs: ["build-release"]
  environment:
    name: release
  rules:
    - if: '$CI_PROJECT_ID == "71839926" && $CI_COMMIT_BRANCH == "release/actogo/0.0.1"'
      when: manual
    - when: never

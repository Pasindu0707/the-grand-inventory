<div
  [ngClass]="{
    'empty-state-card': variant === 'card',
    'empty-state-inline': variant === 'inline',
    'empty-state-sm': size === 'sm',
    'empty-state-md': size === 'md',
    'empty-state-lg': size === 'lg'
  }"
  class="empty-state-container"
>
  <!-- Icon -->
  <div *ngIf="icon" class="empty-state-icon">
    <i [ngClass]="icon" class="empty-state-icon-element"></i>
  </div>

  <!-- Title -->
  <h3 class="empty-state-title">{{ title }}</h3>

  <!-- Subtitle -->
  <p *ngIf="subtitle" class="empty-state-subtitle" [innerHTML]="subtitle"></p>

  <!-- Action Buttons -->
  <div *ngIf="primaryActionLabel || secondaryActionLabel" class="empty-state-actions">
    <button
      *ngIf="secondaryActionLabel"
      type="button"
      class="empty-state-button empty-state-button-secondary"
      (click)="handleSecondaryAction()"
    >
      {{ secondaryActionLabel }}
    </button>
    <button
      *ngIf="primaryActionLabel"
      type="button"
      class="empty-state-button empty-state-button-primary"
      (click)="handlePrimaryAction()"
    >
      {{ primaryActionLabel }}
    </button>
  </div>
</div>
